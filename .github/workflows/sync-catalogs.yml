# 手动同步上游图库索引（2026-11-19 起不再定时触发）
#
# 为什么取消定时：
#   上游索引是整份重建的，而本地的姿势描述（it.pose.en，看图逐条写的 748 条）只存在于
#   本地数据文件里，上游永远不会有。自动同步等于每天拿「上游的姿势清单」覆盖「本地的
#   姿势数据」——即便脚本已会按 id 搬回描述，只要上游改编号、下架条目或调整机位后缀，
#   本地写好的描述就会对不上，分类与排序也会被静默改动。所以默认不动它：
#   需要新素材时在 Actions 页面手动 Run workflow，看过 diff 再自己提交。
# 同步脚本本身保留：node scripts/sync-catalogs.mjs（--offline 用内置样例）。
name: sync-catalogs

on:
  workflow_dispatch:
    inputs:
      offline:
        description: '使用内置样例（不访问上游）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步索引
        run: node scripts/sync-catalogs.mjs ${{ inputs.offline && '--offline' || '' }}

      - name: 自检
        run: node scripts/dry-run.mjs

      # 只给 diff，不写回仓库：同步结果要人看过再提交，避免覆盖本地的姿势描述
      - name: 差异预览
        run: |
          git --no-pager diff --stat
          echo '--- pose.json（前 120 行差异）---'
          git --no-pager diff -- web/public/data/pose.json | head -120
          echo "::notice::同步结果不会自动提交，确认无误后请在本地提交并推送。"
